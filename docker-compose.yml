services:
  postgres:
    image: postgres:16-alpine
    container_name: cortex-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
